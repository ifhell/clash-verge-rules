# ===============================================
# Clash Verge Rev 配置文件
# 基于 Surge 配置迁移，方案 B+C
# ===============================================

# 端口配置
port: 7890
socks-port: 7891
mixed-port: 7892
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

# DNS 配置
dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - localhost.ptlogin2.qq.com
  nameserver:
    - 119.29.29.29
    - 223.5.5.5
  fallback:
    - https://dns.alidns.com/dns-query
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN

# ===============================================
# 代理提供器（你的机场订阅）
# ===============================================
proxy-providers:
  # 机场1 - 替换为你的订阅链接
  airport1:
    type: http
    url: "YOUR_SUBSCRIPTION_URL_1"
    interval: 43200
    path: ./proxies/airport1.yaml
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204

  # 机场2 - 替换为你的订阅链接
  airport2:
    type: http
    url: "YOUR_SUBSCRIPTION_URL_2"
    interval: 43200
    path: ./proxies/airport2.yaml
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204

# ===============================================
# 策略组
# ===============================================
proxy-groups:
  # 主选择器（Final）
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🇭🇰🇹🇼 港台"
      - "🇯🇵🇰🇷 日韩"
      - "🌏 东南亚"
      - "🇺🇸🇨🇦 美加"
      - "🇦🇺 澳大利亚"
      - "🇫🇷 法国"
      - "🇬🇧 英国"
      - "🇩🇪 德国"
      - "🇳🇱 荷兰"
      - "🇷🇴 罗马尼亚"
      - "🇪🇸 西班牙"
      - "🌍 其他地区"
      - "🎯 直连"

  # 自动选择
  - name: "♻️ 自动选择"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    use:
      - airport1
      - airport2
    filter: "^((?!直接连接|全球直连|剩余流量|套餐到期|官网|重置|更新).)*$"

  # 港台（香港/台湾）
  - name: "🇭🇰🇹🇼 港台"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    use:
      - airport1
      - airport2
    filter: "(?i)港|🇭🇰|香港|HKG|Hong|(?:^|[^a-z])HK(?:[^a-z]|$)|台|🇨🇳|台湾|新北|TPE|TWN|Taiwan|(?:^|[^a-z])TW(?:[^a-z]|$)"

  # 东南亚（新加坡/菲律宾/越南/马来西亚/泰国/印尼等）
  - name: "🌏 东南亚"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    use:
      - airport1
      - airport2
    filter: "(?i)坡|🇸🇬|新加坡|狮城|SGP|Singapore|(?:^|[^a-z])SG(?:[^a-z]|$)|菲律|🇵🇭|马尼拉|PHL|Philippine|(?:^|[^a-z])PH(?:[^a-z]|$)|越南|🇻🇳|河内|胡志明|VNM|Vietnam|(?:^|[^a-z])VN(?:[^a-z]|$)|马来|🇲🇾|吉隆坡|MYS|Malaysia|(?:^|[^a-z])MY(?:[^a-z]|$)|泰国|🇹🇭|曼谷|THA|Thailand|(?:^|[^a-z])TH(?:[^a-z]|$)|印尼|印度尼|🇮🇩|雅加达|IDN|Indonesia|(?:^|[^a-z])ID(?:[^a-z]|$)|柬埔寨|🇰🇭|金边|老挝|缅甸|🇲🇲|文莱|🇧🇳"

  # 日韩（日本/韩国）
  - name: "🇯🇵🇰🇷 日韩"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    use:
      - airport1
      - airport2
    filter: "(?i)🇯🇵|日本|东京|大阪|JPN|Japan|(?:^|[^a-z])JP(?:[^a-z]|$)|韩|🇰🇷|首尔|Korea|KOR|(?:^|[^a-z])KR(?:[^a-z]|$)"

  # 美加（美国/加拿大）
  - name: "🇺🇸🇨🇦 美加"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    use:
      - airport1
      - airport2
    filter: "(?i)美|🇺🇸|美国|USA|States|American|洛杉矶|圣何塞|西雅图|凤凰城|达拉斯|芝加哥|Los Angeles|San Jose|Seattle|Phoenix|Dallas|Chicago|(?:^|[^a-z])US(?:[^a-z]|$)|加拿大|🇨🇦|枫叶|Canad|蒙特利尔|多伦多|温哥华|Toronto|Montreal|Vancouver|(?:^|[^a-z])CA(?:[^a-z]|$)"

  # 澳大利亚
